services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    user: "0:0"
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    environment:
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      DATABASE_URL: sqlite:///${SQLITE_PATH}
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_CHANNEL_URL: redis://redis:6379/1
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REDIRECT_URI: ${APP_ORIGIN}/api/spotify/callback/
      FRONTEND_ORIGIN: ${APP_ORIGIN}
      ALLOWED_HOSTS: ${APP_DOMAIN},127.0.0.1,localhost
      CORS_ALLOWED_ORIGINS: ${APP_ORIGIN}
      CSRF_TRUSTED_ORIGINS: ${APP_ORIGIN}
    volumes:
      - sqlite_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz/').read()"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    user: "0:0"
    command: celery -A config worker --loglevel=info --concurrency=1
    environment:
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      DATABASE_URL: sqlite:///${SQLITE_PATH}
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_CHANNEL_URL: redis://redis:6379/1
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REDIRECT_URI: ${APP_ORIGIN}/api/spotify/callback/
      FRONTEND_ORIGIN: ${APP_ORIGIN}
      ALLOWED_HOSTS: ${APP_DOMAIN},127.0.0.1,localhost
      CORS_ALLOWED_ORIGINS: ${APP_ORIGIN}
      CSRF_TRUSTED_ORIGINS: ${APP_ORIGIN}
    volumes:
      - sqlite_data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NUXT_BACKEND_ORIGIN: http://backend:8000
      NUXT_PUBLIC_APP_ORIGIN: ${APP_ORIGIN}
      NUXT_PUBLIC_BACKEND_ORIGIN: ${APP_ORIGIN}
      NUXT_PUBLIC_WS_ORIGIN: ${APP_ORIGIN}
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_HOST: ${APP_HOST}
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  redis_data:
  sqlite_data:
  caddy_data:
  caddy_config:
